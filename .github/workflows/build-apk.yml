name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick (아이콘 변환용)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's|<application|<application\n        android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi

      # ============ 캘린더 인텐트 네이티브 플러그인 자동 생성 ============
      - name: Create Calendar Intent Plugin
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/foodtruck/alarm"
          mkdir -p "$PLUGIN_DIR"

          # CalendarPlugin.java - 캘린더 선택 팝업을 띄우는 네이티브 코드
          cat > "$PLUGIN_DIR/CalendarPlugin.java" << 'EOF'
          package com.foodtruck.alarm;

          import android.content.Intent;
          import android.provider.CalendarContract;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "CalendarIntent")
          public class CalendarPlugin extends Plugin {

              @PluginMethod
              public void addEvent(PluginCall call) {
                  try {
                      String title = call.getString("title", "");
                      String description = call.getString("description", "");
                      String location = call.getString("location", "");
                      Long beginTime = call.getLong("beginTime", 0L);
                      Long endTime = call.getLong("endTime", 0L);

                      Intent intent = new Intent(Intent.ACTION_INSERT);
                      intent.setData(CalendarContract.Events.CONTENT_URI);
                      intent.putExtra(CalendarContract.Events.TITLE, title);
                      intent.putExtra(CalendarContract.Events.DESCRIPTION, description);
                      intent.putExtra(CalendarContract.Events.EVENT_LOCATION, location);
                      intent.putExtra(CalendarContract.EXTRA_EVENT_BEGIN_TIME, beginTime);
                      intent.putExtra(CalendarContract.EXTRA_EVENT_END_TIME, endTime);
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      // 캘린더 앱 선택 팝업 강제 표시
                      Intent chooser = Intent.createChooser(intent, "캘린더 선택");
                      chooser.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      getContext().startActivity(chooser);

                      JSObject ret = new JSObject();
                      ret.put("success", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("캘린더 열기 실패: " + e.getMessage());
                  }
              }
          }
          EOF

          echo "✅ CalendarPlugin.java 생성됨"

          # MainActivity.java에 플러그인 등록
          MAIN_ACTIVITY="$PLUGIN_DIR/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            echo "📝 기존 MainActivity.java:"
            cat "$MAIN_ACTIVITY"

            # registerPlugin 호출 추가 (이미 있으면 스킵)
            if ! grep -q "CalendarPlugin.class" "$MAIN_ACTIVITY"; then
              # Capacitor 5+ 방식: onCreate 안에 registerPlugin 추가
              if grep -q "extends BridgeActivity" "$MAIN_ACTIVITY"; then
                # import 추가
                sed -i 's|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;|' "$MAIN_ACTIVITY"

                # 클래스 안에 onCreate 추가 (없으면)
                if ! grep -q "onCreate" "$MAIN_ACTIVITY"; then
                  sed -i 's|public class MainActivity extends BridgeActivity {|public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(CalendarPlugin.class);\n        super.onCreate(savedInstanceState);\n    }|' "$MAIN_ACTIVITY"
                else
                  # 이미 onCreate가 있으면 super.onCreate 앞에 registerPlugin 추가
                  sed -i 's|super.onCreate(savedInstanceState);|registerPlugin(CalendarPlugin.class);\n        super.onCreate(savedInstanceState);|' "$MAIN_ACTIVITY"
                fi
              fi
            fi

            echo ""
            echo "📝 수정된 MainActivity.java:"
            cat "$MAIN_ACTIVITY"
          else
            echo "❌ MainActivity.java를 찾을 수 없음"
            find android -name "MainActivity.java"
          fi

      - name: Update app name to Korean
        run: |
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">푸드트럭 알리미</string>
              <string name="title_activity_main">푸드트럭 알리미</string>
              <string name="package_name">com.foodtruck.alarm</string>
              <string name="custom_url_scheme">com.foodtruck.alarm</string>
          </resources>
          EOF

      - name: Generate app icons from SVG
        run: |
          if [ ! -f "foodtruck-icon.svg" ]; then
            echo "⚠️  foodtruck-icon.svg 없음 - 기본 아이콘 사용"
            exit 0
          fi

          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%:*}"
            size="${entry#*:}"
            target_dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$target_dir"
            rsvg-convert -w "$size" -h "$size" foodtruck-icon.svg -o "$target_dir/ic_launcher.png"
            cp "$target_dir/ic_launcher.png" "$target_dir/ic_launcher_round.png"
            fg_size=$((size * 108 / 48))
            rsvg-convert -w "$fg_size" -h "$fg_size" foodtruck-icon.svg -o "$target_dir/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # 색상 리소스 중복 방지
          find android/app/src/main/res -type f -name "*.xml" | while read f; do
            if grep -q "ic_launcher_background" "$f" 2>/dev/null; then
              if [[ "$f" == *"mipmap-anydpi-v26"* ]]; then continue; fi
              sed -i '/<color name="ic_launcher_background"/d' "$f"
            fi
          done
          IC_BG_FILE="android/app/src/main/res/values/ic_launcher_background.xml"
          if [ -f "$IC_BG_FILE" ] && ! grep -q "<color" "$IC_BG_FILE"; then
            rm -f "$IC_BG_FILE"
          fi

          MAIN_COLORS="android/app/src/main/res/values/colors.xml"
          if [ ! -f "$MAIN_COLORS" ]; then
            cat > "$MAIN_COLORS" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#EF4444</color>
              <color name="colorPrimaryDark">#DC2626</color>
              <color name="colorAccent">#F97316</color>
              <color name="ic_launcher_background">#EF4444</color>
          </resources>
          EOF
          else
            sed -i 's|</resources>|    <color name="ic_launcher_background">#EF4444</color>\n</resources>|' "$MAIN_COLORS"
          fi

          for entry in "mdpi:24" "hdpi:36" "xhdpi:48" "xxhdpi:72" "xxxhdpi:96"; do
            density="${entry%:*}"
            size="${entry#*:}"
            target_dir="android/app/src/main/res/drawable-${density}"
            mkdir -p "$target_dir"
            rsvg-convert -w "$size" -h "$size" foodtruck-icon.svg -o "$target_dir/ic_stat_notification.png"
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/foodtruck-debug.apk
          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodtruck-apk
          path: apk-output/*.apk
          retention-days: 30
